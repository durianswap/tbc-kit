[package]
name = "tbc-signer-kernel"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
secp256k1 = { version = "=0.31.1", features = ["recovery"] }
secp256k1-sys = { version = "=0.11.0", optional = true, features = ["tbc-musig"] }
zeroize = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
sha2 = "0.10"

[features]
musig = ["dep:secp256k1-sys"]

[patch.crates-io]
secp256k1-sys = { path = "vendor/secp256k1-sys" }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
