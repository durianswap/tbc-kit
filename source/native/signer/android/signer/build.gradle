plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'maven-publish'
}
def identity = new groovy.json.JsonSlurper().parse(rootProject.file('identity.json'))
group = 'io.tbc.local'
version = identity.sdkVersion
android {
  namespace 'io.tbc.signer'
  compileSdk 36
  ndkVersion '27.1.12297006'
  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
    ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    externalNativeBuild { cmake {
      cppFlags '-std=c++17'
      // Only a matching immutable Signer identity can enable optional JNI.
      arguments "-DTBC_SIGNER_MUSIG=${identity.musigEnabled == true ? 'ON' : 'OFF'}"
    } }
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  packaging { jniLibs { keepDebugSymbols += ['**/libtbc_signer_kernel.so'] } }
  publishing { singleVariant('release') { withSourcesJar() } }
}
afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
        artifactId = 'signer'
        pom { name = 'TBC wallet-private Signer (local candidate)' }
      }
    }
    repositories { maven { name = 'Staging'; url = rootProject.file('../maven-repository').toURI() } }
  }
}
