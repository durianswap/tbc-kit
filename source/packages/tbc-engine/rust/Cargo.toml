[workspace]
members = [
  "crates/tbc-engine-core",
  "crates/tbc-engine-native",
  "crates/tbc-engine-wasm",
  "crates/tbc-engine-adapter-parity",
  "crates/tbc-keyless-core",
  "crates/tbc-keyless-native",
  "crates/tbc-keyless-wasm",
  "crates/tbc-wallet-private-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "CC0-1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tbc-sdk = { path = "vendor/tbc-sdk", default-features = false }
