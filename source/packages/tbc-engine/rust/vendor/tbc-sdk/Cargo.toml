[package]
edition = "2024"
name = "tbc-sdk"
version = "0.3.0"
build = false
exclude = [
    "examples/**",
    "docs/superpowers/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust SDK for TuringBitChain transactions and contracts"
homepage = "https://github.com/LoongYearMeta/tbc-rust-sdk"
documentation = "https://docs.rs/tbc-sdk"
readme = "README.md"
keywords = [
    "tbc",
    "blockchain",
    "sdk",
    "utxo",
]
categories = [
    "cryptography",
    "api-bindings",
]
license = "MIT"
repository = "https://github.com/LoongYearMeta/tbc-rust-sdk"

[lib]
name = "tbc_sdk"
path = "src/lib.rs"

[features]
default = ["network-api"]
internal-signing = ["dep:bip32", "dep:bip39", "secp256k1/rand"]
network-api = ["internal-signing", "dep:reqwest", "dep:tokio"]

[[test]]
name = "js_166_parity"
path = "tests/js_166_parity.rs"

[dependencies.bip32]
version = "0.5.3"
features = [
    "secp256k1",
    "std",
]
default-features = false
optional = true

[dependencies.bip39]
version = "2.2.2"
features = [
    "rand",
    "zeroize",
]
optional = true

[dependencies.bs58]
version = "0.5"

[dependencies.hex]
version = "0.4"

[dependencies.rayon]
version = "1"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "rustls-tls",
]
default-features = false
optional = true

[dependencies.ripemd]
version = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.secp256k1]
version = "0.31"

[target.'cfg(target_arch = "wasm32")'.dependencies.k256]
version = "0.13.4"
features = ["ecdsa", "schnorr"]
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2"

[dependencies.unicode-normalization]
version = "0.1"

[dependencies.tokio]
version = "1"
features = ["time"]
optional = true

[dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
    "test-util",
    "time",
]
