[package]
name = "tbc-engine-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tbc-sdk.workspace = true
unicode-normalization = "=0.1.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.secp256k1]
version = "0.31"

[target.'cfg(target_arch = "wasm32")'.dependencies.k256]
version = "0.13.4"
features = ["ecdsa", "schnorr"]
default-features = false

[dev-dependencies]
secp256k1 = "0.31"
tbc-sdk = { workspace = true, features = ["internal-signing"] }
